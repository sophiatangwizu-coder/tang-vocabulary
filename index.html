cinated）", "en": "She was deeply fascinated by/ with various cultural diversities she encountered during her travels.", "answers": ["She was deeply fascinated by various cultural diversities she encountered during her travels.", "She was deeply fascinated with various cultural diversities she encountered during her travels."], "notes": "", "raw": "她在旅行中遇到的各种文化多样性让她深深着迷。（fascinated）\nShe was deeply fascinated by/ with various cultural diversities she encountered during her travels.", "source": "词汇简析73 · Test 23", "paragraph": 807}, {"id": "v73-24-phrase-01", "catId": "v73", "subId": "t24", "type": "phrase", "zh": "一个可行的计划", "en": "a feasible plan", "answers": [], "notes": "", "raw": "一个可行的计划 — a feasible plan", "source": "词汇简析73 · Test 24", "paragraph": 812}, {"id": "v73-24-phrase-02", "catId": "v73", "subId": "t24", "type": "phrase", "zh": "感觉好像（feel）", "en": "feel as if/as though", "answers": ["feel as if", "feel as though"], "notes": "", "raw": "感觉好像（feel）— feel as if/as though", "source": "词汇简析73 · Test 24", "paragraph": 813}, {"id": "v73-24-phrase-03", "catId": "v73", "subId": "t24", "type": "phrase", "zh": "想要做某事", "en": "feel like doing sth.", "answers": [], "notes": "", "raw": "想要做某事 — feel like doing sth.", "source": "词汇简析73 · Test 24", "paragraph": 814}, {"id": "v73-24-phrase-04", "catId": "v73", "subId": "t24", "type": "phrase", "zh": "把书给某人拿来（fetch）", "en": "fetch sb. the book", "answers": [], "notes": "", "raw": "把书给某人拿来（fetch）— fetch sb. the book", "source": "词汇简析73 · Test 24", "paragraph": 815}, {"id": "v73-24-phrase-05", "catId": "v73", "subId": "t24", "type": "phrase", "zh": "对…感到厌烦（feed）", "en": "be fed up with", "answers": [], "notes": "", "raw": "对…感到厌烦（feed）— be fed up with", "source": "词汇简析73 · Test 24", "paragraph": 816}, {"id": "v73-24-phrase-06", "catId": "v73", "subId": "t24", "type": "phrase", "zh": "相当多的（few）", "en": "quite a few = many", "answers": ["quite a few", "many"], "notes": "", "raw": "相当多的（few）— quite a few = many", "source": "词汇简析73 · Test 24", "paragraph": 817}, {"id": "v73-24-phrase-07", "catId": "v73", "subId": "t24", "type": "phrase", "zh": "在医学领域", "en": "in the field of medicine", "answers": [], "notes": "", "raw": "在医学领域 — in the field of medicine", "source": "词汇简析73 · Test 24", "paragraph": 818}, {"id": "v73-24-phrase-08", "catId": "v73", "subId": "t24", "type": "phrase", "zh": "一场激烈的争论", "en": "a fierce argument", "answers": [], "notes": "", "raw": "一场激烈的争论 — a fierce argument", "source": "词汇简析73 · Test 24", "paragraph": 819}, {"id": "v73-24-phrase-09", "catId": "v73", "subId": "t24", "type": "phrase", "zh": "争取平等权利（fight）", "en": "fight for equal rights", "answers": [], "notes": "", "raw": "争取平等权利（fight）— fight for equal rights", "source": "词汇简析73 · Test 24", "paragraph": 820}, {"id": "v73-24-phrase-10", "catId": "v73", "subId": "t24", "type": "phrase", "zh": "填写一张申请表（fill）", "en": "fill in/out an application form", "answers": [], "notes": "", "raw": "填写一张申请表（fill）— fill in/out an application form", "source": "词汇简析73 · Test 24", "paragraph": 821}, {"id": "v73-24-phrase-11", "catId": "v73", "subId": "t24", "type": "phrase", "zh": "经济独立", "en": "be financially independent", "answers": [], "notes": "", "raw": "经济独立 — be financially independent", "source": "词汇简析73 · Test 24", "paragraph": 822}, {"id": "v73-24-phrase-12", "catId": "v73", "subId": "t24", "type": "phrase", "zh": "支付罚款", "en": "pay a fine", "answers": [], "notes": "", "raw": "支付罚款 — pay a fine", "source": "词汇简析73 · Test 24", "paragraph": 823}, {"id": "v73-24-phrase-13", "catId": "v73", "subId": "t24", "type": "phrase", "zh": "完成做某事", "en": "finish doing sth.", "answers": [], "notes": "", "raw": "完成做某事 — finish doing sth.", "source": "词汇简析73 · Test 24", "paragraph": 824}, {"id": "v73-24-phrase-14", "catId": "v73", "subId": "t24", "type": "phrase", "zh": "纵火", "en": "set fire to sth. = set sth. on fire", "answers": ["set fire to sth.", "set sth. on fire"], "notes": "", "raw": "纵火 — set fire to sth. = set sth. on fire", "source": "词汇简析73 · Test 24", "paragraph": 825}, {"id": "v73-24-phrase-15", "catId": "v73", "subId": "t24", "type": "phrase", "zh": "首先", "en": "first of all/ in the first place", "answers": ["first of all", "in the first place"], "notes": "", "raw": "首先 — first of all/ in the first place", "source": "词汇简析73 · Test 24", "paragraph": 826}, {"id": "v73-24-phrase-16", "catId": "v73", "subId": "t24", "type": "phrase", "zh": "保持健康", "en": "keep fit/stay healthy", "answers": ["keep fit", "stay healthy"], "notes": "", "raw": "保持健康 — keep fit/stay healthy", "source": "词汇简析73 · Test 24", "paragraph": 827}, {"id": "v73-24-phrase-17", "catId": "v73", "subId": "t24", "type": "phrase", "zh": "适合这份工作（fit）", "en": "be fit for the job", "answers": [], "notes": "", "raw": "适合这份工作（fit）— be fit for the job", "source": "词汇简析73 · Test 24", "paragraph": 828}, {"id": "v73-24-phrase-18", "catId": "v73", "subId": "t24", "type": "phrase", "zh": "适应社会的需要", "en": "fit in with the needs of society", "answers": [], "notes": "", "raw": "适应社会的需要 — fit in with the needs of society", "source": "词汇简析73 · Test 24", "paragraph": 829}, {"id": "v73-24-phrase-19", "catId": "v73", "subId": "t24", "type": "phrase", "zh": "确定开会的时间（fix）", "en": "fix a time for the meeting", "answers": [], "notes": "", "raw": "确定开会的时间（fix）— fix a time for the meeting", "source": "词汇简析73 · Test 24", "paragraph": 830}, {"id": "v73-24-phrase-20", "catId": "v73", "subId": "t24", "type": "phrase", "zh": "突然着火（flame）", "en": "burst into flames", "answers": [], "notes": "", "raw": "突然着火（flame）— burst into flames", "source": "词汇简析73 · Test 24", "paragraph": 831}, {"id": "v73-24-sentence-01", "catId": "v73", "subId": "t24", "type": "sentence", "zh": "她想不出如何解决那个数学问题。（figure）", "en": "She couldn’t figure out how to solve that math problem.", "answers": [], "notes": "", "raw": "她想不出如何解决那个数学问题。（figure）\nShe couldn’t figure out how to solve that math problem.", "source": "词汇简析73 · Test 24", "paragraph": 834}, {"id": "v73-24-sentence-02", "catId": "v73", "subId": "t24", "type": "sentence", "zh": "我进屋时，发现她正在勤奋地练习钢琴。（find）", "en": "When I entered the room, I found her practicing the piano diligently.", "answers": [], "notes": "", "raw": "我进屋时，发现她正在勤奋地练习钢琴。（find）\nWhen I entered the room, I found her practicing the piano diligently.", "source": "词汇简析73 · Test 24", "paragraph": 836}, {"id": "v73-24-sentence-03", "catId": "v73", "subId": "t24", "type": "sentence", "zh": "我坚信，每个人都有能力做出改变。（firmly）", "en": "I firmly believe that every individual has the power to make a change.", "answers": [], "notes": "", "raw": "我坚信，每个人都有能力做出改变。（firmly）\nI firmly believe that every individual has the power to make a change.", "source": "词汇简析73 · Test 24", "paragraph": 838}, {"id": "v73-24-sentence-04", "catId": "v73", "subId": "t24", "type": "sentence", "zh": "朋友们没有告诉他真相，害怕会伤害他的感情。（for fear that）", "en": "His friends didn’t tell him the truth for fear that it might hurt his feelings.", "answers": [], "notes": "", "raw": "朋友们没有告诉他真相，害怕会伤害他的感情。（for fear that）\nHis friends didn’t tell him the truth for fear that it might hurt his feelings.", "source": "词汇简析73 · Test 24", "paragraph": 840}, {"id": "v73-24-sentence-05", "catId": "v73", "subId": "t24", "type": "sentence", "zh": "我第一次来上海时，就情不自禁地对霓虹灯闪烁的摩天大楼赞叹不已。（the first time）", "en": "The first time I came to Shanghai, I couldn’t help but marvel at the neon-lit skyscrapers.", "answers": ["The first time I came to Shanghai, I couldn’t help but marvel at the neon-lit skyscrapers.", "The first time I came to Shanghai, I couldn’t help marveling at the neon-lit skyscrapers."], "notes": "Or couldn’t help marveling at", "raw": "我第一次来上海时，就情不自禁地对霓虹灯闪烁的摩天大楼赞叹不已。（the first time）\nThe first time I came to Shanghai, I couldn’t help but marvel at the neon-lit skyscrapers.\nOr couldn’t help marveling at", "source": "词汇简析73 · Test 24", "paragraph": 842}, {"id": "v73-25-phrase-01", "catId": "v73", "subId": "t25", "type": "phrase", "zh": "弹性工作时间", "en": "flexible working hours", "answers": [], "notes": "", "raw": "弹性工作时间 → flexible working hours", "source": "词汇简析73 · Test 25", "paragraph": 848}, {"id": "v73-25-phrase-02", "catId": "v73", "subId": "t25", "type": "phrase", "zh": "在空中飘浮", "en": "float in the air", "answers": [], "notes": "", "raw": "在空中飘浮 → float in the air", "source": "词汇简析73 · Test 25", "paragraph": 849}, {"id": "v73-25-phrase-03", "catId": "v73", "subId": "t25", "type": "phrase", "zh": "大量涌入城市（flood）", "en": "flood into the city", "answers": [], "notes": "", "raw": "大量涌入城市（flood） → flood into the city", "source": "词汇简析73 · Test 25", "paragraph": 850}, {"id": "v73-25-phrase-04", "catId": "v73", "subId": "t25", "type": "phrase", "zh": "集中（注意力）于", "en": "focus (one’s attention) on", "answers": [], "notes": "", "raw": "集中（注意力）于 → focus (one’s attention) on", "source": "词汇简析73 · Test 25", "paragraph": 851}, {"id": "v73-25-phrase-05", "catId": "v73", "subId": "t25", "type": "phrase", "zh": "遵守规则", "en": "follow/obey/observe the rules", "answers": [], "notes": "", "raw": "遵守规则 → follow/obey/observe the rules", "source": "词汇简析73 · Test 25", "paragraph": 852}, {"id": "v73-25-phrase-06", "catId": "v73", "subId": "t25", "type": "phrase", "zh": "爱好园艺（fond）", "en": "be fond of gardening", "answers": [], "notes": "", "raw": "爱好园艺（fond） → be fond of gardening", "source": "词汇简析73 · Test 25", "paragraph": 853}, {"id": "v73-25-phrase-07", "catId": "v73", "subId": "t25", "type": "phrase", "zh": "使某人出丑（fool）", "en": "make a fool of sb.", "answers": [], "notes": "", "raw": "使某人出丑（fool） → make a fool of sb.", "source": "词汇简析73 · Test 25", "paragraph": 854}, {"id": "v73-25-phrase-08", "catId": "v73", "subId": "t25", "type": "phrase", "zh": "欺骗某人做某事", "en": "fool/cheat/deceive/trick sb. into doing sth.", "answers": [], "notes": "", "raw": "欺骗某人做某事 → fool/cheat/deceive/trick sb. into doing sth.", "source": "词汇简析73 · Test 25", "paragraph": 855}, {"id": "v73-25-phrase-09", "catId": "v73", "subId": "t25", "type": "phrase", "zh": "禁止某人做某事（forbid）", "en": "forbid sb. to do sth.", "answers": ["forbid sb. to do sth.", "forbid sb. from doing sth.", "ban sb. from doing sth.", "prohibit sb. from doing sth."], "notes": "forbid/ban/prohibit sb. from doing sth.", "raw": "禁止某人做某事（forbid） → forbid sb. to do sth.\nforbid/ban/prohibit sb. from doing sth.", "source": "词汇简析73 · Test 25", "paragraph": 856}, {"id": "v73-25-phrase-10", "catId": "v73", "subId": "t25", "type": "phrase", "zh": "开始生效/实施（force）", "en": "come into force", "answers": [], "notes": "", "raw": "开始生效/实施（force） → come into force", "source": "词汇简析73 · Test 25", "paragraph": 858}, {"id": "v73-25-phrase-11", "catId": "v73", "subId": "t25", "type": "phrase", "zh": "原谅某人做某事（forgive）", "en": "forgive sb. for doing sth.", "answers": [], "notes": "", "raw": "原谅某人做某事（forgive） → forgive sb. for doing sth.", "source": "词汇简析73 · Test 25", "paragraph": 859}, {"id": "v73-25-phrase-12", "catId": "v73", "subId": "t25", "type": "phrase", "zh": "以……的形式", "en": "in the form of", "answers": [], "notes": "", "raw": "以……的形式 → in the form of", "source": "词汇简析73 · Test 25", "paragraph": 860}, {"id": "v73-25-phrase-13", "catId": "v73", "subId": "t25", "type": "phrase", "zh": "养成做某事的习惯", "en": "form the habit of doing sth.", "answers": [], "notes": "", "raw": "养成做某事的习惯 → form the habit of doing sth.", "source": "词汇简析73 · Test 25", "paragraph": 861}, {"id": "v73-25-phrase-14", "catId": "v73", "subId": "t25", "type": "phrase", "zh": "恢复昔日的辉煌（former）", "en": "be restored to its former glory", "answers": [], "notes": "", "raw": "恢复昔日的辉煌（former） → be restored to its former glory", "source": "词汇简析73 · Test 25", "paragraph": 862}, {"id": "v73-25-phrase-15", "catId": "v73", "subId": "t25", "type": "phrase", "zh": "发财", "en": "make a fortune", "answers": [], "notes": "", "raw": "发财 → make a fortune", "source": "词汇简析73 · Test 25", "paragraph": 863}, {"id": "v73-25-phrase-16", "catId": "v73", "subId": "t25", "type": "phrase", "zh": "盼望做（forward）", "en": "look forward to doing sth.", "answers": [], "notes": "", "raw": ctly forbidden in this lake.", "answers": [], "notes": "", "raw": "出于安全考虑，严禁在这片湖泊游泳。（forbid）\nDue to safety concerns, swimming is strictly forbidden in this lake.", "source": "词汇简析73 · Test 25", "paragraph": 875}, {"id": "v73-25-sentence-04", "catId": "v73", "subId": "t25", "type": "sentence", "zh": "在这门创意写作课上，你可以自由地表达你最狂野的想象。（free）", "en": "In this creative writing class, you are free to express your wildest imagination.", "answers": [], "notes": "", "raw": "在这门创意写作课上，你可以自由地表达你最狂野的想象。（free）\nIn this creative writing class, you are free to express your wildest imagination.", "source": "词汇简析73 · Test 25", "paragraph": 877}, {"id": "v73-25-sentence-05", "catId": "v73", "subId": "t25", "type": "sentence", "zh": "当你忙于日常琐事时，很容易忘记日落有多美。（forget）", "en": "When you are busy with daily chores/routines, it’s easy to forget how beautiful the sunset is.", "answers": [], "notes": "", "raw": "当你忙于日常琐事时，很容易忘记日落有多美。（forget）\nWhen you are busy with daily chores/routines, it’s easy to forget how beautiful the sunset is.", "source": "词汇简析73 · Test 25", "paragraph": 879}, {"id": "v73-26-phrase-01", "catId": "v73", "subId": "t26", "type": "phrase", "zh": "患难见真情。", "en": "A friend in need is a friend indeed.", "answers": [], "notes": "", "raw": "患难见真情。 → A friend in need is a friend indeed.", "source": "词汇简析73 · Test 26", "paragraph": 883}, {"id": "v73-26-phrase-02", "catId": "v73", "subId": "t26", "type": "phrase", "zh": "吓唬某人做/不敢做（frighten）", "en": "frighten sb. into/out of doing sth.", "answers": ["frighten sb. into doing sth.", "frighten sb. out of doing sth."], "notes": "", "raw": "吓唬某人做/不敢做（frighten） → frighten sb. into/out of doing sth.", "source": "词汇简析73 · Test 26", "paragraph": 884}, {"id": "v73-26-phrase-03", "catId": "v73", "subId": "t26", "type": "phrase", "zh": "因屡次失败而灰心", "en": "be frustrated by repeated failures", "answers": [], "notes": "", "raw": "因屡次失败而灰心 → be frustrated by repeated failures", "source": "词汇简析73 · Test 26", "paragraph": 885}, {"id": "v73-26-phrase-04", " 经验（previous） → based on previous experience", "source": "词汇简析73 · Test 45", "paragraph": 1564}, {"id": "v73-45-phrase-14", "catId": "v73", "subId": "t45", "type": "phrase", "zh": "成为…的猎物（prey）", "en": "fall prey to...", "answers": [], "notes": "", "raw": "成为…的猎物（prey） → fall prey to...", "source": "词汇简析73 · Test 45", "paragraph": 1565}, {"id": "v73-45-phrase-15", "catId": "v73", "subId": "t45", "type": "phrase", "zh": "以…自豪（pride）", "en": "take pride in...", "answers": [], "notes": "", "raw": "以…自豪（pride） → take pride in...", "source": "词汇简析73 · Test 45", "paragraph": 1566}, {"id": "v73-45-phrase-16", "catId": "v73", "subId": "t45", "type": "phrase", "zh": "一件非常重要的事情（primary）", "en": "a matter of primary importance", "answers": [], "notes": "", "raw": "一件非常重要的事情（primary） → a matter of primary importance", "source": "词汇简析73 · Test 45", "paragraph": 1567}, {"id": "v73-45-phrase-17", "catId": "v73", "subId": "t45", "type": "phrase", "zh": "原则上", "en": "in principle", "answers": [], "notes": "", "raw": "原则上 → in principle", "source": "词汇简析73 · Test 45", "paragraph": 1568}, {"id": "v73-45-phrase-18", "catId": "v73", "subId": "t45", "type": "phrase", "zh": "分清轻重缓急（priority）", "en": "work out one’s priorities", "answers": [], "notes": "", "raw": "分清轻重缓急（priority） → work out one’s priorities", "source": "词汇简析73 · Test 45", "paragraph": 1569}, {"id": "v73-45-phrase-19", "catId": "v73", "subId": "t45", "type": "phrase", "zh": "侵犯某人的隐私", "en": "invade one’s privacy", "answers": [], "notes": "", "raw": "侵犯某人的隐私 → invade one’s privacy", "source": "词汇简析73 · Test 45", "paragraph": 1570}, {"id": "v73-45-phrase-20", "catId": "v73", "subId": "t45", "type": "phrase", "zh": "教学流程", "en": "teaching procedures", "answers": [], "notes": "", "raw": "教学流程 → teaching procedures", "source": "词汇简析73 · Test 45", "paragraph": 1571}, {"id": "v73-45-sentence-01", "catId": "v73", "subId": "t45", "type": "sentence", "zh": "尽管有压力，我已为比赛做好了充分的准备。（prepare）", "en": "In spite of pressure, I am well prepared for the competition.", "answers": [], "notes": "", "raw": "尽管有压力，我已为比赛做好了充分的准备。（prepare）\nIn spite of pressure, I am well prepared for the competition.", "source": "词汇简析73 · Test 45", "paragraph": 1574}, {"id": "v73-45-sentence-02", "catId": "v73", "subId": "t45", "type": "sentence", "zh": "经济分析师预测，股市在未来几个月将保持稳定。（predict）", "en": "Economic analysts predict that the stock market will remain stable in the coming months.", "answers": [], "notes": "", "raw": "经济分析师预测，股市在未来几个月将保持稳定。（predict）\nEconomic analysts predict that the stock market will remain stable in the coming months.", "source": "词汇简析73 · Test 45", "paragraph": 1576}, {"id": "v73-45-sentence-03", "catId": "v73", "subId": "t45", "type": "sentence", "zh": "他假装没听见我的问题，继续做自己的事情。（pretend）", "en": "He pretended not to hear my question and continued with his own tasks.", "answers": [], "notes": "", "raw": "他假装没听见我的问题，继续做自己的事情。（pretend）\nHe pretended not to hear my question and continued with his own tasks.", "source": "词汇简析73 · Test 45", "paragraph": 1578}, {"id": "v73-45-sentence-04", "catId": "v73", "subId": "t45", "type": "sentence", "zh": "定期锻炼和健康饮食有助于预防心脏病的发生。（prevent）", "en": "Regular exercise and a healthy diet help prevent the occurrence of heart disease.", "answers": [], "notes": "", "raw": "定期锻炼和健康饮食有助于预防心脏病的发生。（prevent）\nRegular exercise and a healthy diet help prevent the occurrence of heart disease.", "source": "词汇简析73 · Test 45", "paragraph": 1580}, {"id": "v73-45-sentence-05", "catId": "v73", "subId": "t45", "type": "sentence", "zh": "从长远来看，忽视环境法规的政府往往要付出代价。（price）", "en": "In the long run, governments that ignore environmental regulations often have to pay the price.", "answers": [], "notes": "", "raw": "从长远来看，忽视环境法规的政府往往要付出代价。（price）\nIn the long run, governments that ignore environmental regulations often have to pay the price.", "source": "词汇简析73 · Test 45", "paragraph": 1582}, {"id": "v73-46-phrase-01", "catId": "v73", "subId": "t46", "type": "phrase", "zh": "继续某人的工作（proceed）", "en": "proceed <script id="help-data" type="application/json">"TANG 词汇库 使用说明\n\n一 开始使用\n电脑：解压发布包，用 Chrome、Edge、Firefox 或 Safari 打开 index.html，无需联网。\n手机和平板：推荐访问发布后的网址。部分系统的文件预览器不支持脚本或本机存储；如本地文件不能操作，请改用浏览器访问发布网站。\n学习记录只在当前浏览器保存，打开网页时提示到期复习。关闭网页后不会发通知。不同浏览器、文件位置、网站地址之间不自动同步，请导出备份后迁移。\n\n二 词库与导入\n词汇简析73 包含 Test 01 至 Test 73，短语和整句分别标注。搜索支持中英文和部分匹配。\n词库中的复选框支持跨分类挑选，或新建任务时按 Test 批量选择。\n下载“词库导入模板.docx”，按最简单格式填写：第一行是大分类名称，Test / Unit / Lesson / Chapter 标题自动成为小分类，其他每行写一个词条，例如“1. daily routines 例行日常”。英文在前、中文在后；也支持中文在前、英文在后。保存为 docx 后导入，预览并确认写入。旧版 `.doc` 需先另存为 `.docx`。旧版七列表格模板仍兼容。\n编辑词条时可以修改中英文、补充完整答案和备注。内置词条可恢复为当前发布版本原文；已有任务保存独立内容快照。\n原文包含少量疑似错误或提示性写法，已保留原文并在相应备注中标注。多表达的自动判分仅作辅助；请核对实际表达，不要把未经核实的近义句直接加入答案。\n\n三 背诵与复习\n每张卡翻面后如实选择“没记住”“有点模糊”“记住了”。连续两次记住完成该卡；模糊或遗忘会清零。\n双向模式每次随机展示中文或英文，两方向合并计算掌握次数。空格翻面，数字 1 / 2 / 3 评分。\n全部卡片首次完成后才开始安排复习。初次间隔：曾遗忘 1 天，只有模糊 2 天，一直记住 4 天。\n后续采用 1、2、4、7、15、30、60 天的间隔阶梯。遗忘回到 1 天，模糊退一级，全程记住进一级。按浏览器本地日历日期判断到期。\n到期复习只包含到期卡和待纠错卡，错题优先；整轮完成后计算下次日期。中途离开可续背，逾期不堆积重复任务。\n\n四 小测试\n首次背诵完成后可以测试。默认 24 个计分项，支持 20—25 个；范围不足时减少，不重复凑数。\n匹配每一对独立计分。选择与判断使用同范围内不冲突的答案作为干扰，无法产生适当选项时改用英文书写。\n提交后显示参考答案；80% 及以上通过。英文判分接受已登记表达及部分括号和单词级斜杠变体，统一大小写、空格、弯引号及句末标点，不忽略拼写、词序和语法错误。\n如表达正确但未收录，可自行改判。补充答案必须再次确认；仅明确补充的表达会同时进入词库、原任务及该道测试题。\n错题进入原任务的优先复习队列，改判撤销该次错误。复习完成的旧错题不会因查看结果再次加入。\n\n五 默写\n默写不要求先完成背诵。打开“默写练习”后，直接按大分类和 Test 选择题库范围，设置题目数量和方向：中到英、英到中，或双向转换（中到英约 80%，英到中约 20%）。生成后题目和顺序固定。\n预览题目只显示题目，不显示答案或横线；可以全屏打开、调整字号并上下滚动，适合投屏让学生在纸上作答。\n学生版按题目方向显示提示并提供书写空白，整句提供两行；教师版附对应答案和可接受表达。均为真正的 Word docx 文件。纸笔默写不自动计分或记录错题。\n\n六 备份与恢复\n“导出完整备份”包含词库、网站设置、任务、进度、复习日程、测试、错题与默写。\n“恢复备份”先检查数据，展示摘要，再整体替换当前记录。恢复前请下载当前备份。\n定期备份，尤其在清理浏览器、更换文件路径或设备前。隐私模式中学习记录可能在窗口关闭后消失。保存失败会显示明确提示，此时先导出备份。\n\n七 生成网站发布包\n先保存网站名称与机构名称，点击“生成网站发布包”，核对摘要后下载 ZIP。\n发布包把所有有效内置词条、本机导入内容及编辑结果作为新版内置词库。它只含教学内容和网站信息，不含任何人的任务、成绩或错题。\nZIP 内有 index.html、词库导入模板.docx、使用说明.txt。先解压，再打开网页；发给学生后无需重新导入。\n新发布网页仍可继续编辑、导入和再次生成发布包。发布操作不自动上传 GitHub，也不修改当前数据。\n同一浏览器站点更新网页时会保留本机学习记录，本机词条修改优先于新内置版本；已有任务维持原有快照。恢复原文会采用当前发布版本内容。\n\n八 发布到 GitHub Pages\n1. 在自己的 GitHub 创建用于网站的仓库。\n2. 将 ZIP 解压后的 index.html、模板和说明上传到仓库根目录；不要只上传 ZIP。\n3. 打开仓库 Settings → Pages，选择 Deploy from a branch，分支选择 main，目录选择 / (root)，保存。\n4. 等待 GitHub 部署完成，打开 Pages 显示的网站地址，即可发给学生。\n5. 以后用新发布包的文件替换仓库中对应文件，即可更新网站。\n每个学生在自己的浏览器里保存学习记录。静态网页没有教师后台或云端同步；上传公开仓库的词库会对访问者公开。\n"</script>

function taskCard(t){const due=dueCount(t),done=t.session?t.session.indices.length-t.session.queue.length:0,total=t.session?.indices.length||t.cards.length,progress=t.learnedAt&&!t.session?100:Math.round(done/total*100);return `<article class="task-card"><div class="row spread"><span class="badge ${due?'orange':t.learnedAt?'purple':''}">${t.learnedAt?'复习':'背诵'}${due?' · '+due+' 张到期':''}</span><span class="tiny muted">${fmt(t.created)}</span></div><div><h3>${esc(t.name)}</h3><span class="tiny muted">${t.cards.length} 张卡片 · ${{'zh-en':'中 → 英','en-zh':'英 → 中',mixed:'随机双向'}[t.mode]}</span></div><div><div class="progress"><i style="width:${progress}%"></i></div><span class="tiny muted">${t.session?`本轮已完成 ${done} / ${total}`:t.learnedAt?`下次复习 ${fmt(Math.min(...t.cards.map(c=>c.due||Date.now())))}`:'等待开始，让记忆生根'}</span></div><div class="actions">${btn(t.session?'继续本轮':t.learnedAt?due?'开始复习':'查看进度':'开始背诵','study','',`data-id="${attr(t.id)}"`)}${t.learnedAt?btn('小测试','exam-setup','ghost',`data-id="${attr(t.id)}"`):''}${btn('详情','task-detail','ghost',`data-id="${attr(t.id)}"`)}${btn('删除','delete-task','danger small',`data-id="${attr(t.id)}"`)}</div></article>`}
function home(){const due=allDue(),learned=state.tasks.filter(t=>t.learnedAt).length;return heading('你走的每一步，都在靠近理想。','每一次坚持，都会让你离目标更近一步。')+`<section class="hero"><div><div class="eyebrow">A LITTLE EVERY DAY</div><h2>${due?`有 ${due} 张卡片，<br>正等你再次想起。`:'今天记住一点点，<br>明天就会更从容。'}</h2><p>${due?'先从容易忘记的开始，稳稳地把它们找回来。':'挑选一组词汇，为明天的自己积累底气。'}</p>${btn(due?'去复习  ↗':'开始一组背诵  ＋',due?'go-tasks':'task-new','')}</div><div class="hero-art" aria-hidden="true"><div class="mini-card back"><strong>记住了！</strong></div><div class="mini-card"><span>WORD OF THE DAY</span><strong>${dailyWord()[0]}</strong><span>${dailyWord()[1]} · 每日更新</span><div style="font-size:32px;color:#70974b;margin-top:12px">✿</div></div><span class="spark">✧</span></div></section><div class="stats"><div class="stat"><span class="label">词库里的积累</span><strong>${entries().length.toLocaleString()}</strong><span class="tiny muted">词条等待探索</span></div><div class="stat"><span class="label">正在背诵</span><strong>${state.tasks.length-learned}</strong><span class="tiny muted">按自己的节奏来</span></div><div class="stat"><span class="label">到期复习</span><strong>${due}</strong><span class="tiny muted">薄弱卡片优先</span></div><div class="stat"><span class="label">已完成首次背诵</span><strong>${learned}</strong><span class="tiny muted">进入长期记忆旅程</span></div></div><div class="section-head"><h2>我的学习计划 <span class="tiny muted">MY LEARNING</span></h2>${btn('查看全部 →','go-tasks','ghost small')}</div>${state.tasks.length?`<div class="grid">${[...state.tasks].sort((a,b)=>dueCount(b)-dueCount(a)).slice(0,3).map(taskCard).join('')}</div>`:empty('还没有背诵任务。选好范围，就可以出发了。',btn('建立第一个任务','task-new'))}<div class="section-head"><h2>探索词库</h2>${btn('打开题库 →','go-library','ghost small')}</div><div class="grid">${categories().map(c=>`<article class="panel"><span class="badge">内置 / 本机词库</span><h3 style="margin-top:14px">${esc(c.name)}</h3><p class="muted tiny">${c.subs.length} 个子分类 · ${entries().filter(e=>e.catId===c.id).length} 个词条</p>${btn('浏览词条 →','cat-open','ghost small',`data-cat="${attr(c.id)}"`)}</article>`).join('')}</div>`}
function filtered(){const q=C.normalize(filter.q);return entries().filter(e=>(!filter.cat||e.catId===filter.cat)&&(!filter.sub||e.subId===filter.sub)&&(!filter.type||e.type===filter.type)&&(!q||C.normalize([e.en,e.zh,...e.answers,e.notes].join(' ')).includes(q)))}
function highlight(s){if(!filter.q.trim())return esc(s);const q=filter.q.trim(),regex=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');let out='',last=0;for(const m of s.matchAll(regex)){out+=esc(s.slice(last,m.index))+'<mark class="mark">'+esc(m[0])+'</mark>';last=m.index+m[0].length}return out+esc(s.slice(last))}
function library(){const all=filtered(),pages=Math.max(1,Math.ceil(all.length/30));filter.page=Math.min(filter.page,pages-1);return heading('词汇题库','查找、挑选，然后把词汇变成你的学习卡片。',btn('Word 模板','template','ghost')+btn('导入词库','import'))+`<div class="toolbar"><input id="search" type="search" placeholder="搜索英文、中文、短语或句子…" aria-label="搜索词库" value="${attr(filter.q)}"><select id="type-filter" aria-label="词条类型"><option value="">全部类型</option><option value="phrase" ${filter.type==='phrase'?'selected':''}>短语</option><option value="sentence" ${filter.type==='sentence'?'selected':''}>整句</option></select>${btn('全选筛选结果','select-filtered','secondary')}</div><div class="library-layout"><aside class="category-list">${btn('全部词库','cat-open',!filter.cat?'active':'','data-cat=""')}${categories().map(c=>`<details ${!filter.cat||filter.cat===c.id?'open':''}><summary>${esc(c.name)}</summary>${c.subs.map(s=>btn(esc(s.name),'sub-open','sub '+(filter.cat===c.id&&filter.sub===s.id?'active':''),`data-cat="${attr(c.id)}" data-sub="${attr(s.id)}"`)).join('')}</details>`).join('')}</aside><section><div class="row spread tiny muted" style="margin-bottom:12px"><span>找到 ${all.length} 个词条</span><span>点击复选框可跨分类选择</span></div>${all.slice(filter.page*30,(filter.page+1)*30).map(e=>`<article class="entry"><input type="checkbox" data-select="${attr(e.id)}" ${selected.has(e.id)?'checked':''} aria-label="选择 ${attr(e.zh)}"><div><div class="english">${highlight(e.en)}</div><div class="chinese">${highlight(e.zh)}</div><span class="badge ${e.type==='sentence'?'purple':''}">${e.type==='sentence'?'整句':'短语'}</span></div><div>${btn('编辑','entry-edit','ghost small',`data-id="${attr(e.id)}"`)}</div></article>`).join('')||empty('没有找到匹配的词条，试试其他关键词。')}<div class="pagination">${btn('上一页','page-prev','ghost small',filter.page===0?'disabled':'')}<span class="tiny">${filter.page+1} / ${pages}</span>${btn('下一页','page-next','ghost small',filter.page>=pages-1?'disabled':'')}</div></section></div>${selected.size?`<div class="selection-bar"><span>已选择 <strong>${selected.size}</strong> 个词条</span><div class="actions">${btn('清空','select-clear','secondary small')}${btn('建立背诵任务 ＋','task-selected','lime')}</div></div>`:''}`}
function tasksPage(){return heading('闪卡背诵','连续两次记住，让熟悉变成真正的掌握。',btn('新建背诵任务 ＋','task-new'))+(allDue()?`<div class="notice">今天有 ${allDue()} 张卡片需要复习，已优先排列在前面。</div>`:'')+(state.tasks.length?`<div class="grid">${[...state.tasks].sort((a,b)=>dueCount(b)-dueCount(a)).map(taskCard).join('')}</div>`:empty('从词库中选择范围，建立第一项背诵任务。',btn('选择背诵范围','task-new')))}
function flash(){const t=task(activeTask);if(!t?.session)return tasksPage();const s=t.session,c=t.cards[s.queue[0]],e=c.entry;if(!s.direction)s.direction=t.mode==='mixed'?(Math.random()<.5?'zh-en':'en-zh'):t.mode;const front=s.direction==='zh-en'?e.zh:e.en,back=s.direction==='zh-en'?e.en:e.zh,done=s.indices.length-s.queue.length;return `<div class="flash-wrap">${heading(esc(t.name),`${s.kind==='review'?'到期复习':'首次背诵'} · ${s.direction==='zh-en'?'中 → 英':'英 → 中'}`,btn('暂停并返回','go-tasks','ghost'))}<div class="row spread tiny muted flash-meta"><span>本轮完成 ${done} / ${s.indices.length}</span><span>当前卡片连续记住 ${s.round[s.queue[0]].streak} / 2 次</span></div><div class="progress" style="margin-bottom:24px"><i style="width:${done/s.indices.length*100}%"></i></div><button class="flip-card ${s.flipped?'flipped':''}" data-action="flip" aria-label="翻转闪卡" aria-pressed="${s.flipped}"><div class="flip-inner"><div class="face" aria-hidden="${s.flipped}"><div class="label">${e.type==='sentence'?'整句':'短语'} · ${esc(e.source)}</div><div class="word">${esc(front)}</div><div class="hint">先在心里回想，再点击翻面 ↻</div></div><div class="face back" aria-hidden="${!s.flipped}"><div class="label">参考答案</div><div class="word">${esc(back)}</div>${e.answers.length?`<div class="tiny" style="margin-top:15px">其他表达：${esc(e.answers.join('；'))}</div>`:''}${e.notes?`<div class="tiny muted" style="margin-top:14px;white-space:pre-wrap">${esc(e.notes)}</div>`:''}<div class="hint">如实评价，复习才会更适合你</div></div></div></button><div class="ratings">${btn('↺ 没记住','rate-no','no',!s.flipped?'disabled':'')}${btn('≈ 有点模糊','rate-fuzzy','fuzzy',!s.flipped?'disabled':'')}${btn('✓ 记住了','rate-yes','yes',!s.flipped?'disabled':'')}</div><p class="lesson-tip">空格翻面 · 翻面后按 1 / 2 / 3 评分 · 进度自动保存</p></div>`}
function testsPage(){const ready=state.tasks.filter(t=>t.learnedAt);return heading('小测试','用一次小测，看看哪些内容已经真正留下。')+`<section class="panel"><h2>选择已完成背诵的任务</h2><div class="toolbar"><select id="exam-task" aria-label="测试任务">${ready.map(t=>`<option value="${attr(t.id)}">${esc(t.name)} · ${t.cards.length} 张</option>`).join('')}</select>${btn('创建小测试','exam-select','',ready.length?'':'disabled')}</div><p class="tiny muted">匹配、选择、判断、英文书写 · 默认 24 个计分项 · 80% 通过</p>${ready.length?'':'<p class="muted">先完成一项背诵任务，测试入口就会开启。</p>'}</section><div class="section-head"><h2>测试记录</h2></div>${state.exams.length?`<div class="grid">${[...state.exams].reverse().map(e=>{let r=C.score(e);return `<article class="task-card"><span class="badge ${e.submitted?r.passed?'':'orange':'purple'}">${e.submitted?r.passed?'Congratulations':'Need practice':'尚未提交'}</span><h3>${esc(e.name)}</h3><p class="tiny muted">${fmt(e.created)} · ${e.questions.length} 题 ${e.submitted?'· '+Math.round(r.percent)+'%':''}</p>${btn(e.submitted?'查看结果':'继续作答','exam-open','ghost',`data-id="${attr(e.id)}"`)}</article>`}).join('')}</div>`:empty('完成一次测试后，成绩和答案会保存在这里。')}`}
function examPage(){const e=exam(activeExam);if(!e)return testsPage();const r=C.score(e),submitted=!!e.submitted;return heading(esc(e.name)+' · 小测试',`${e.questions.length} 个计分项 · 提交后显示答案`,btn('返回测试记录','go-tests','ghost'))+(submitted?`<section class="score celebrate"><div class="big">${Math.round(r.percent)}<span style="font-size:23px">%</span></div><h2>${r.passed?'Congratulations ✦':'Need practice'}</h2><p>${r.correct} / ${r.total} 正确 · ${r.passed?'做得不错，保持复习节奏。':'没关系，错题已安排进优先复习。'}</p></section>`:'<p class="notice">答案自动保存。匹配题每一对计 1 分，请为每个中文选择对应英文。</p>')+e.questions.map((q,i)=>`<article class="question"><span class="badge ${q.type==='write'?'purple':''}">${i+1} · ${{match:'匹配',choice:'选择',judge:'判断',write:'英文书写'}[q.type]}</span><div class="question-title">${esc(q.entry.zh)}</div>${q.type==='write'?`<textarea data-answer="${attr(q.id)}" aria-label="第 ${i+1} 题英文答案" placeholder="写出对应的英文…" ${submitted?'disabled':''}>${esc(q.answer)}</textarea>`:q.type==='match'?`<select data-answer="${attr(q.id)}" aria-label="第 ${i+1} 题匹配答案" ${submitted?'disabled':''}><option value="">请选择对应英文</option>${q.options.map(o=>`<option value="${attr(o.id)}" ${q.answer===o.id?'selected':''}>${esc(o.text)}</option>`).join('')}</select>`:q.type==='judge'?`<p>${esc(q.options[0].text)}</p>${[{id:'true',text:'正确'},{id:'false',text:'错误'}].map(o=>`<label class="option"><input type="radio" name="q-${attr(q.id)}" data-answer="${attr(q.id)}" value="${o.id}" ${q.answer===o.id?'checked':''} ${submitted?'disabled':''}>${o.text}</label>`).join('')}`:q.options.map(o=>`<label class="option"><input type="radio" name="q-${attr(q.id)}" data-answer="${attr(q.id)}" value="${attr(o.id)}" ${q.answer===o.id?'checked':''} ${submitted?'disabled':''}>${esc(o.text)}</label>`).join('')}${submitted?`<div class="answer ${C.scoreQuestion(q)?'':'wrong'}"><strong>${C.scoreQuestion(q)?'✓ 正确':'↺ 需要练习'}${q.override!==null?' · 已自行改判':''}</strong><br>参考答案：${esc(q.entry.en)}${q.entry.answers.length?'<br>其他表达：'+esc(q.entry.answers.join('；')):''}${q.type==='judge'?'<br>本题判断：'+(q.correct==='true'?'正确':'错误'):''}</div><div class="actions" style="margin-top:10px">${!C.scoreQuestion(q)?btn('改判为正确','exam-override','ghost small',`data-q="${attr(q.id)}"`):q.override!==null?btn('撤销改判','exam-auto','ghost small',`data-q="${attr(q.id)}"`):''}</div>`:''}</article>`).join('')+(!submitted?`<div class="selection-bar"><span>准备好检验成果了吗？</span>${btn('提交测试','exam-submit','lime')}</div>`:'')}
function dictationsPage(){
 const cards=state.dictations.length?`<div class="grid">${[...state.dictations].reverse().map(d=>`<article class="task-card"><span class="badge purple">纸笔默写 · ${d.entries.length} 题</span><h3>${esc(d.name)}</h3><p class="tiny muted">${fmt(d.created)} · 保存原始题序</p><div class="actions">${btn('学生版 Word','dictation-export','',`data-id="${attr(d.id)}" data-teacher="false"`)}${btn('教师版 Word','dictation-export','ghost',`data-id="${attr(d.id)}" data-teacher="true"`)}</div>${btn('预览题目','dictation-preview','ghost small',`data-id="${attr(d.id)}"`)}</article>`).join('')}</div>`:empty('从题库选择词条，即可生成第一份默写。',btn('生成默写','dictation-new'));
 return heading('默写练习','从题库直接选题，随机生成一份纸笔默写。',btn('生成默写 ＋','dictation-new'))+`<p class="notice">不需要先背诵。学生版只显示题目和书写空间，教师版附参考答案；预览页不显示答案，适合直接投屏。</p>${cards}<div class="site-footer">TANG · © 2026 TANG 词汇库</div>`;
}
function settingsPage(){return heading('数据与发布','保存自己的成长，也把精心整理的词库分享出去。')+`<div class="settings-grid"><section class="panel"><h2>网站信息</h2><label class="field"><span>网站名称</span><input id="site-name" maxlength="40" value="${attr(state.settings.name)}"></label><label class="field"><span>学校或机构名称（可选）</span><input id="school-name" maxlength="80" value="${attr(state.settings.school)}" placeholder="例如：高三英语学习小组"></label>${btn('保存网站信息','settings-save')}</section><section class="panel"><h2>备份与恢复</h2><p class="muted">完整备份包含词库、背诵进度、复习日程、错题、测试和默写记录。换设备时用它继续学习。</p><div class="actions">${btn('导出完整备份','backup')}${btn('恢复备份','restore','ghost')}</div><p class="tiny muted" style="margin-top:18px">建议定期备份。清理浏览器数据、隐私模式或更换浏览器，都可能导致本机记录无法访问。</p></section><section class="panel publish wide"><div><h2>将当前词库固化为内置词库</h2><p class="muted">把当前分类、词条和网站名称制作成新版网页，发给学生即可使用，也可上传 GitHub Pages。</p><span class="badge">不包含任何个人学习记录</span></div>${btn('生成网站发布包','publish-preview')}</section><section class="panel wide"><h2>离线使用小贴士</h2><p class="muted">电脑上解压后用浏览器打开 index.html。手机上建议使用发布后的网站地址；部分手机文件预览器不能运行网页功能。不同文件路径、浏览器或网站地址的存储空间可能不同，迁移时请用完整备份。</p><div class="actions">${btn('下载使用说明','help','ghost')}${btn('下载 Word 导入模板','template','ghost')}</div><p class="tiny muted" style="margin-top:15px">词库版本 ${esc(state.bank.version)} · ${entries().length} 个词条 · 学习记录仅存于当前浏览器</p></section></div>`}
function render(){document.title=state.settings.name;$$('[data-brand]').forEach(e=>e.textContent=state.settings.name);$$('[data-nav]').forEach(e=>e.classList.toggle('active',e.dataset.nav===(page==='flash'?'tasks':page==='exam'?'tests':page)));$('#top-date').textContent='  '+new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})+(state.settings.school?' · '+state.settings.school:'');$('#view').innerHTML=({home,library,tasks:tasksPage,flash,tests:testsPage,exam:examPage,dictations:dictationsPage,settings:settingsPage}[page]||home)()}
function go(p){page=p;render();window.scrollTo({top:0,behavior:'instant'})}
function scopeMarkup(kind){const catAttr=kind==='scope'?'data-scope-cat':'data-dict-cat',subAttr=kind==='scope'?'data-scope-sub':'data-dict-sub';return `<div class="scope-list"><div class="scope-grid">${categories().map(c=>`<div class="scope-category-title">${esc(c.name)}</div>${c.subs.map(sub=>`<label><input type="checkbox" ${catAttr}="${attr(c.id)}" ${subAttr}="${attr(sub.id)}" ${kind==='scope'&&filter.cat===c.id&&(!filter.sub||filter.sub===sub.id)?'checked':''}>${esc(sub.name)}</label>`).join('')}`).join('')}</div></div>`}
function taskDialog(useSelected=false){modal('建立一次背诵',`<label class="field"><span>任务名称</span><input id="task-name" maxlength="80" placeholder="例如：本周 Test 01—03"></label><label class="field"><span>背诵方向</span><select id="task-mode"><option value="zh-en">中 → 英</option><option value="en-zh">英 → 中</option><option value="mixed">随机双向（合并掌握次数）</option></select></label>${useSelected?`<p>已选择 ${selected.size} 个词条。</p><input id="scope-selected" type="hidden" value="yes">`:`<label class="field"><span>内容类型</span><select id="scope-type"><option value="">短语和整句</option><option value="phrase">仅短语</option><option value="sentence">仅整句</option></select><div class="row">${btn('全部选择','scope-all','ghost small')}${btn('全部取消','scope-none','ghost small')}</div>${scopeMarkup('scope')}<p id="scope-count" class="tiny muted">请选择范围，可跨分类勾选。</p>`}<p class="tiny muted">词条以当前版本建立任务；每张卡连续两次记住，才完成本轮。</p>`,btn('取消','close','ghost')+btn('建立并开始','task-create'));updateScopeCount()}
function scopeEntries(){if($('#scope-selected'))return entries().filter(e=>selected.has(e.id));let keys=new Set($$('[data-scope-cat]:checked').map(e=>e.dataset.scopeCat+'\0'+e.dataset.scopeSub));return entries().filter(e=>keys.has(e.catId+'\0'+e.subId)&&(!$('#scope-type').value||e.type===$('#scope-type').value))}
function updateScopeCount(){if($('#scope-count'))$('#scope-count').textContent='已选择 '+scopeEntries().length+' 个词条'}
function editDialog(id){const e=entry(id);modal('编辑词条',`<input id="edit-id" type="hidden" value="${attr(id)}"><p class="tiny muted">${esc(e.source)} · 不影响已经建立的任务</p><label class="field"><span>中文</span><textarea id="edit-zh">${esc(e.zh)}</textarea></label><label class="field"><span>英文参考答案</span><textarea id="edit-en">${esc(e.en)}</textarea></label><label class="field"><span>其他可接受答案（每行一个完整表达）</span><textarea id="edit-answers">${esc(e.answers.join('\n'))}</textarea></label><label class="field"><span>备注</span><textarea id="edit-notes">${esc(e.notes)}</textarea></label>`,btn('保存修改','entry-save'))}
function examSetup(id){const t=task(id);if(!t?.learnedAt)return toast('请先完成首次背诵');modal('创建小测试',`<input id="test-task-id" type="hidden" value="${attr(id)}"><p>${esc(t.name)} · ${t.cards.length} 个词条</p><label class="field"><span>题目数量</span><select id="exam-count">${[20,21,22,23,24,25].map(n=>`<option ${n===24?'selected':''}>${n}</option>`).join('')}</select></label><p class="tiny muted">四类题型尽量平均。词条不足时自动减少；没有合适干扰项时使用英文书写题。</p>`,btn('开始测试','exam-create'))}
function dictationDialog(){modal('生成纸笔默写',`<label class="field"><span>默写名称</span><input id="dict-name" maxlength="80" placeholder="例如：周五词汇默写"></label><label class="field"><span>出题方向</span><select id="dict-mode"><option value="zh-en">中 → 英</option><option value="en-zh">英 → 中</option><option value="mixed">双向转换（中 → 英 80%，英 → 中 20%）</option></select></label><label class="field"><span>内容类型</span><select id="dict-type"><option value="">短语和整句</option><option value="phrase">仅短语</option><option value="sentence">仅整句</option></select>${`<div class="row">${btn('全选范围','dict-scope-all','ghost small')}${btn('全部取消','dict-scope-none','ghost small')}</div>`}${scopeMarkup('dict')}<p id="dict-scope-count" class="tiny muted">已选择 0 个词条</p><label class="field"><span>随机抽取数量</span><input id="dict-count" type="number" min="1" value="10"></label><p class="tiny muted">题目不重复，生成后题序固定。预览不会显示答案。</p>`,btn('取消','close','ghost')+btn('生成默写','dictation-create'));updateDictScopeCount()}
function dictationEntries(){const keys=new Set($$('[data-dict-cat]:checked').map(e=>e.dataset.dictCat+'\0'+e.dataset.dictSub));return entries().filter(e=>keys.has(e.catId+'\0'+e.subId)&&(!$('#dict-type')?.value||e.type===$('#dict-type').value))}
function updateDictScopeCount(){if($('#dict-scope-count'))$('#dict-scope-count').textContent='已选择 '+dictationEntries().length+' 个词条'}
async function doBackup(){download(new Blob([JSON.stringify({format:'vocab-garden-backup',schema:1,created:new Date().toISOString(),state},null,2)],{type:'application/json'}),'TANG词汇库完整备份-'+C.day(Date.now())+'.json')}
function publishedHTML(bank){const doc=new DOMParser().parseFromString(pristine,'text/html');doc.querySelector('#bank-data').textContent=JSON.stringify(bank).replace(/</g,'\\u003c');doc.querySelector('title').textContent=bank.settings.name;doc.querySelectorAll('[data-brand]').forEach(e=>e.textContent=bank.settings.name);return '<!doctype html>\n'+doc.documentElement.outerHTML}
async function publish(){const bank=effectiveBank();bank.version=new Date().toISOString()+'-'+C.uid().slice(0,8);C.validateBank(bank);const zip=new JSZip();zip.file('index.html',publishedHTML(bank));zip.file('词库导入模板.docx',await (await D.template()).arrayBuffer());zip.file('使用说明.txt',help);download(await zip.generateAsync({type:'blob',compression:'DEFLATE'}),'词汇网站发布包-'+C.day(Date.now())+'.zip');toast('发布包已生成，不含个人学习记录')}
function previewImport(){const current=entries(),cats=categories();let seen=new Set();for(const r of importRows){const key=[r.cat,r.sub,C.normalize(r.zh),C.normalize(r.en)].join('\0');r.duplicate=seen.has(key)||current.some(e=>cats.find(c=>c.id===e.catId)?.name===r.cat&&cats.find(c=>c.id===e.catId)?.subs.find(s=>s.id===e.subId)?.name===r.sub&&C.normalize(e.zh)===C.normalize(r.zh)&&C.normalize(e.en)===C.normalize(r.en));seen.add(key)}const errors=importRows.filter(r=>r.error).length,duplicates=importRows.filter(r=>r.duplicate).length;modal('导入预览',`<p>共 ${importRows.length} 行 · ${errors} 行有错误 · ${duplicates} 行重复</p><div class="preview-scroll">${importRows.map(r=>`<div class="preview-row"><span class="badge ${r.error?'red':r.duplicate?'orange':''}">第 ${r.row} 行 · ${r.error?'有错误':r.duplicate?'重复':'可导入'}</span><p>${esc(r.cat)} / ${esc(r.sub)} · ${r.type==='sentence'?'整句':'短语'}</p><strong>${esc(r.zh)}</strong><br>${esc(r.en)}${r.error?'<p style="color:#b3493e">'+esc(r.error)+'</p>':''}</div>`).join('')}</div>${errors?'<label class="row" style="margin-top:15px"><input id="skip-errors" type="checkbox">我确认跳过错误行，仅导入其余有效行</label>':''}<label class="row" style="margin-top:12px"><input id="skip-duplicates" type="checkbox" checked>跳过完全重复的词条</label>`,btn('取消','close','ghost')+btn('确认导入','import-confirm'))}
async function act(action,el){
 if(action==='close')return close();
 if(action.startsWith('go-'))return go(action.slice(3));
 if(action==='template')return download(await D.template(),'词库导入模板.docx');
 if(action==='help')return download(new Blob([help],{type:'text/plain;charset=utf-8'}),'使用说明.txt');
 if(action==='task-new')return taskDialog();if(action==='task-selected')return taskDialog(true);
 if(action==='scope-all'||action==='scope-none'){$$('[data-scope-cat]').forEach(e=>e.checked=action==='scope-all');return updateScopeCount()}
 if(action==='task-create'){
  const pool=scopeEntries();if(!pool.length)return toast('请至少选择一个词条');
  const t=C.makeTask($('#task-name').value.trim()||'背诵任务 '+(state.tasks.length+1),pool,$('#task-mode').value);state.tasks.push(t);C.startSession(t);activeTask=t.id;await save();close();go('flash');return;
 }
 if(action==='delete-task'){if(!confirm('删除这项背诵任务及其测试记录？词库内容不会删除。'))return;state.tasks=state.tasks.filter(t=>t.id!==el.dataset.id);state.exams=state.exams.filter(e=>e.taskId!==el.dataset.id);if(activeTask===el.dataset.id)activeTask=null;await save();render();toast('背诵任务已删除');return;}
 if(action==='study'){
  const t=task(el.dataset.id);if(!C.startSession(t)){return modal('复习尚未到期',`<p>下次复习：${fmt(Math.min(...t.cards.map(c=>c.due)))}。系统会优先安排薄弱卡片。</p><p>也可以回到词库建立新的背诵任务。</p>`,btn('好的','close'))}
  activeTask=t.id;await save();go('flash');return;
 }
 if(action==='task-detail'){
  const t=task(el.dataset.id);return modal(t.name,`<p>${t.cards.length} 张卡片 · ${t.learnedAt?'已完成首次背诵':'首次背诵中'} · ${dueCount(t)} 张待复习</p><div class="preview-scroll">${t.cards.map(c=>`<div class="preview-row"><strong>${esc(c.entry.zh)}</strong><br>${esc(c.entry.en)}<br><span class="tiny muted">遗忘 ${c.misses} 次 · 模糊 ${c.fuzzy} 次 · 待纠错 ${c.pendingErrors.length} 项${c.due?' · 下次 '+fmt(c.due):''}</span></div>`).join('')}</div>`,btn('关闭','close'));
 }
 if(action==='flip'){
  const t=task(activeTask);t.session.flipped=!t.session.flipped;
  const card=$('.flip-card');card.classList.toggle('flipped',t.session.flipped);card.setAttribute('aria-pressed',String(t.session.flipped));card.querySelector('.face:not(.back)').setAttribute('aria-hidden',String(t.session.flipped));card.querySelector('.back').setAttribute('aria-hidden',String(!t.session.flipped));$$('.ratings button').forEach(b=>b.disabled=!t.session.flipped);await save();return;
 }
 if(action.startsWith('rate-')){
  const t=task(activeTask);if(!t?.session?.flipped)return;
  const wasLearn=t.session.kind==='learn',finished=C.rate(t,action.slice(5));if(!finished)render();await save();
  if(finished){go('tasks');modal(wasLearn?'这一组，记住了！ ✦':'本轮复习完成！ ✦',`<div class="score celebrate compact-score"><div class="big">✿</div><p>${wasLearn?'所有卡片都已连续两次记住。':'本轮到期卡片都已完成。'}下一次复习已按每张卡的表现安排。</p></div>`,btn('回到任务','close','ghost')+btn('做一次小测试','exam-setup','',`data-id="${attr(t.id)}"`));$('#modal').classList.add('dialog-compact')}return;
 }
 if(action==='cat-open'){filter.cat=el.dataset.cat||'';filter.sub='';filter.page=0;return go('library')}
 if(action==='sub-open'){filter.cat=el.dataset.cat;filter.sub=el.dataset.sub;filter.page=0;const leftScroll=$('.category-list')?.scrollTop||0;render();requestAnimationFrame(()=>$('.category-list')?.scrollTo({top:leftScroll,left:0,behavior:'instant'}));return}
 if(action==='page-prev'){filter.page--;return render()}if(action==='page-next'){filter.page++;return render()}
 if(action==='select-filtered'){filtered().forEach(e=>selected.add(e.id));return render()}if(action==='select-clear'){selected.clear();return render()}
 if(action==='entry-edit')return editDialog(el.dataset.id);
 if(action==='entry-save'){
  const e=C.clone(entry($('#edit-id').value)),zh=$('#edit-zh').value.trim(),en=$('#edit-en').value.trim();if(!zh||!en)return toast('中文和英文不能为空');
  Object.assign(e,{zh,en,answers:$('#edit-answers').value.split('\n').map(x=>x.trim()).filter(Boolean),notes:$('#edit-notes').value.trim()});state.overrides[e.id]=e;await save();close();render();toast('已保存，已有任务内容不变');return;
 }
 if(action==='entry-reset'){
  if(!confirm('将此词条恢复为当前发布版本的原文？已有任务不受影响。'))return;delete state.overrides[el.dataset.id];await save();close();render();return;
 }
 if(action==='exam-select'){if($('#exam-task').value)examSetup($('#exam-task').value);return}
 if(action==='exam-setup')return examSetup(el.dataset.id);
 if(action==='exam-create'){const e=C.makeExam(task($('#test-task-id').value),Number($('#exam-count').value));if(!e.questions.length)return toast('范围内没有可出题的词条');state.exams.push(e);activeExam=e.id;await save();close();go('exam');return}
 if(action==='exam-open'){activeExam=el.dataset.id;return go('exam')}
 if(action==='exam-submit'){
  const e=exam(activeExam);if(e.submitted)return;const unanswered=e.questions.filter(q=>!q.answer.trim()).length;if(unanswered&&!confirm(`还有 ${unanswered} 题未作答，将计为错误。确认提交？`))return;
  e.submitted=Date.now();C.reconcileErrors(e,task(e.taskId));await save();render();window.scrollTo(0,0);return;
 }
 if(action==='exam-override'||action==='exam-auto'){
  const e=exam(activeExam),q=e.questions.find(q=>q.id===el.dataset.q);q.override=action==='exam-auto'?null:!C.scoreQuestion(q);C.reconcileErrors(e,task(e.taskId));await save();const y=window.scrollY;render();window.scrollTo(0,y);return;
 }
 if(action==='dictation-new')return dictationDialog();
 if(action==='dict-scope-all'||action==='dict-scope-none'){$$('[data-dict-cat]').forEach(e=>e.checked=action==='dict-scope-all');return updateDictScopeCount()}
 if(action==='dictation-create'){const pool=dictationEntries(),n=Number($('#dict-count').value);if(!pool.length)return toast('请至少选择一个 Test 或词条范围');if(!Number.isInteger(n)||n<1||n>pool.length)return toast(`请输入 1—${pool.length} 的整数`);const mode=$('#dict-mode').value;const mixedDir=()=>Math.random()<.8?'zh-en':'en-zh';const picked=C.shuffle(pool).slice(0,n).map(e=>{const direction=mode==='mixed'?mixedDir():mode;return {...C.clone(e),prompt:direction==='zh-en'?e.zh:e.en,direction}});const d={id:C.uid(),taskId:null,name:$('#dict-name').value.trim()||'默写 '+(state.dictations.length+1),created:Date.now(),entries:picked,mode};state.dictations.push(d);await save();close();go('dictations');return;}
 if(action==='dictation-export'){const d=state.dictations.find(d=>d.id===el.dataset.id),teacher=el.dataset.teacher==='true';return download(await D.dictation(d,teacher,state.settings),d.name.replace(/[\\/:*?"<>|]/g,'_')+'-'+(teacher?'教师版':'学生版')+'.docx')}
 if(action==='dictation-preview'){const d=state.dictations.find(d=>d.id===el.dataset.id);const items=d.entries.map(e=>`<li>${esc(e.prompt||e.zh)}</li>`).join('');modal(d.name,`<div class="row spread"><span class="muted">仅显示题目 · 可直接投屏</span><div class="actions">${btn('全屏显示','dict-fullscreen','ghost small')}${btn('A−','dict-font-down','ghost small')}${btn('字号','dict-font-reset','ghost small')}${btn('A＋','dict-font-up','ghost small')}</div></div><ol id="dict-preview-list" class="dictation-preview-list">${items}</ol>`,btn('关闭','close'));$('#modal').classList.add('dialog-fullscreen');return}
 if(action==='dict-fullscreen'){const d=$('#modal');d.classList.toggle('dialog-page-fullscreen');d.classList.toggle('dialog-fullscreen',d.classList.contains('dialog-page-fullscreen'));const b=el;b.textContent=d.classList.contains('dialog-page-fullscreen')?'退出全屏':'全屏显示';return;}
 if(action==='dict-font-up'||action==='dict-font-down'||action==='dict-font-reset'){const list=$('#dict-preview-list');if(list){let size=Number(list.dataset.size||24);size=action==='dict-font-up'?Math.min(48,size+2):action==='dict-font-down'?Math.max(14,size-2):24;list.dataset.size=size;list.style.fontSize=size+'px'}return;}
 if(action==='settings-save'){
  const name=$('#site-name').value.trim();if(!name)return toast('请输入网站名称');state.settings={name,school:$('#school-name').value.trim()};state.settingsDirty=true;await save();render();toast('网站信息已保存');return;
 }
 if(action==='backup')return doBackup();if(action==='restore'){$('#backup-file').value='';$('#backup-file').click();return}
 if(action==='restore-confirm'){
  if(!recovery)return;if(!$('#restore-ack').checked)return toast('请先确认已保存当前备份');
  const next=C.clone(recovery.state);C.validateBackup({format:'vocab-garden-backup',schema:1,state:next});await writeState(next);state=next;recovery=null;selected.clear();activeTask=null;activeExam=null;await save();close();go('home');toast('备份恢复完成');return;
 }
 if(action==='publish-preview')return modal('确认网站发布内容',`<p>网站名称：<strong>${esc(state.settings.name)}</strong></p><p>学校 / 机构：${esc(state.settings.school||'未设置')}</p><p>${categories().length} 个大分类 · ${categories().reduce((n,c)=>n+c.subs.length,0)} 个子分类 · ${entries().length} 个词条</p><p class="notice">仅分享词库和网站设置，不包含个人背诵进度、复习记录、成绩或错题。</p><p class="tiny muted">下载 ZIP 后先解压。index.html 可直接打开，或按说明上传 GitHub Pages。此操作不会自动上传网站，也不会修改当前学习数据。</p>`,btn('取消','close','ghost')+btn('确认生成 ZIP','publish'));
 if(action==='publish'){busy=true;el.disabled=true;el.textContent='正在生成…';try{await publish()}finally{busy=false}close();return}
 if(action==='import'){$('#import-file').value='';$('#import-file').click();return}
 if(action==='import-confirm'){
  if(importRows.some(r=>r.error)&&!$('#skip-errors')?.checked)return toast('请修正文件重新导入，或明确勾选跳过错误行');
  let rows=importRows.filter(r=>!r.error&&(!$('#skip-duplicates').checked||!r.duplicate));if(!rows.length)return toast('没有可导入的新词条');
  for(const r of rows){
   let cats=categories(),cat=cats.find(c=>c.name===r.cat);if(!cat){cat={id:C.uid(),name:r.cat,subs:[]};state.customCategories.push(cat)}
   let sub=cat.subs.find(s=>s.name===r.sub);if(!sub){sub={id:C.uid(),name:r.sub};let custom=state.customCategories.find(c=>c.id===cat.id);if(!custom){custom={id:cat.id,name:cat.name,subs:[]};state.customCategories.push(custom)}custom.subs.push(sub)}
   state.imported.push({id:C.uid(),catId:cat.id,subId:sub.id,type:r.type,zh:r.zh,en:r.en,answers:r.answers,notes:r.notes,raw:r.zh+' → '+r.en,source:r.cat+' · '+r.sub});
  }
  await save();close();go('library');toast(`已导入 ${rows.length} 个词条`);return;
 }
}
document.addEventListener('click',async ev=>{const nav=ev.target.closest('[data-nav]');if(nav){if(busy)return;go(nav.dataset.nav);return}const el=ev.target.closest('[data-action]');if(!el||el.disabled||busy)return;try{await act(el.dataset.action,el)}catch(e){console.error(e);toast('操作未完成：'+e.message);el.disabled=false}});
let searchTimer;
document.addEventListener('input',ev=>{
 const e=ev.target;if(e.id==='search'){filter.q=e.value;filter.page=0;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{const pos=e.selectionStart;render();$('#search')?.focus();try{$('#search')?.setSelectionRange(pos,pos)}catch{}},180)}
 if(e.dataset.answer){const ex=exam(activeExam);if(ex&&!ex.submitted){const q=ex.questions.find(q=>q.id===e.dataset.answer);q.answer=e.value;save()}}
});
document.addEventListener('change',ev=>{const e=ev.target;if(e.id==='type-filter'){filter.type=e.value;filter.page=0;render()}if(e.dataset.select){e.checked?selected.add(e.dataset.select):selected.delete(e.dataset.select);render()}if(e.dataset.scopeCat||e.id==='scope-type')updateScopeCount();if(e.dataset.dictCat||e.id==='dict-type')updateDictScopeCount()});
$('#import-file').addEventListener('change',async ev=>{const f=ev.target.files[0];if(!f)return;try{importRows=await D.readDocx(f);previewImport()}catch(e){toast('导入失败：'+e.message)}});
$('#backup-file').addEventListener('change',async ev=>{const f=ev.target.files[0];if(!f)return;try{if(f.size>100*1024*1024)throw Error('备份超过 100 MB');const b=JSON.parse(await f.text());C.validateBackup(b);if(b.state.bank.family!==embedded.family)throw Error('该备份属于其他词库应用');recovery=b;const s=b.state;modal('恢复完整备份',`<p>备份将整体替换当前浏览器数据。</p><p>网站：${esc(s.settings.name)}<br>${s.bank.entries.length+s.imported.length} 个词条 · ${s.tasks.length} 个背诵任务 · ${s.exams.length} 次测试 · ${s.dictations.length} 次默写</p><p class="notice">请先下载当前备份，再确认恢复。</p>${btn('下载当前完整备份','backup','ghost')}<label class="row" style="margin-top:20px"><input id="restore-ack" type="checkbox">我已保存当前备份，确认整体替换</label>`,btn('取消','close','ghost')+btn('确认恢复','restore-confirm'))}catch(e){recovery=null;toast('无法恢复：'+e.message)}});
document.addEventListener('keydown',ev=>{if(page!=='flash'||$('#modal').open||/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName)||ev.repeat)return;if(ev.code==='Space'){ev.preventDefault();act('flip').catch(console.error)}else if(['1','2','3'].includes(ev.key)&&task(activeTask)?.session?.flipped){ev.preventDefault();act('rate-'+['no','fuzzy','yes'][Number(ev.key)-1]).catch(console.error)}});
$('#modal').addEventListener('cancel',ev=>{if(busy){ev.preventDefault();return}const d=$('#modal');if(document.fullscreenElement===d)document.exitFullscreen?.().catch(()=>{});d.classList.remove('dialog-fullscreen','dialog-page-fullscreen','dialog-compact')});
try{
 C.validateBank(embedded);db=await openDB();const loaded=await readState();if(loaded){C.validateBackup({format:'vocab-garden-backup',schema:1,state:loaded});state=loaded}else state=fresh();
 if(state.seenVersion!==embedded.version){
  let conflicts=0;const old=new Map(state.bank.entries.map(e=>[e.id,e]));
  for(const e of embedded.entries){if(state.overrides[e.id]&&JSON.stringify(old.get(e.id))!==JSON.stringify(e))conflicts++;const imported=state.imported.find(x=>x.id===e.id);if(imported){if(JSON.stringify(imported)!==JSON.stringify(e)&&!state.overrides[e.id]){state.overrides[e.id]=C.clone(imported);conflicts++}state.imported=state.imported.filter(x=>x.id!==e.id)}}
  // Keep removed source entries locally when a local edit depends on them.
  for(const [id,e] of old)if(state.overrides[id]&&!embedded.entries.some(x=>x.id===id)){state.imported.push(e);state.customCategories=C.mergeCategories(state.customCategories,state.bank.categories.filter(c=>c.id===e.catId))}
  state.bank=C.clone(embedded);state.seenVersion=embedded.version;if(!state.settingsDirty)state.settings=C.clone(embedded.settings);
  $('#version-warning').textContent=`已载入新版内置词库。个人学习记录和导入内容已保留。${conflicts?' '+conflicts+' 个本机修改继续优先使用，可在编辑中恢复新版原文。':''}`;$('#version-warning').classList.remove('hidden');
 }
 await save();
}catch(e){
 if(!state)state=fresh();storageError(e);
}
render();
// Available for deterministic QA; no user data leaves this browser.
window.VocabApp={getState:()=>C.clone(state),effectiveBank,publishedHTML,save,go,core:C,docs:D};
})();
</script>
</body></html>
